services:
  - type: web
    name: aspire-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.ml.train_model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
